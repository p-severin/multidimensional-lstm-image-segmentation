[project]
name = "multidimensional-lstm-image-segmentation"
version = "0.1.0"
description = "LSTM-based image segmentation using multi-directional and multi-dimensional LSTM architectures on PASCAL VOC"
requires-python = ">=3.11"
dependencies = [
    "keras>=2.15,<3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "tensorflow>=2.15,<3",
    "tf-slim>=1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in math/ML code: l, I, O)
    "F841",   # local variable assigned but never used (common in research code)
    "B007",   # unused loop control variable
    "SIM108", # use ternary operator (readability preference)
    "UP015",  # unnecessary open mode parameters
]

[tool.ruff.lint.isort]
known-first-party = ["utils", "md_lstm", "single_LSTM", "vanilla_lstm"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportAttributeAccessIssue = false
